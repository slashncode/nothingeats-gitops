# The admin's pages, server functions and assets, all under /admin on the shop's origin.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backoffice-admin
  namespace: nothingeats
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - nothingeats.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /admin
      backendRefs:
        - name: backoffice
          port: 80
