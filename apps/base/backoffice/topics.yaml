# Owned by the backoffice (Payload, record 040), written through its outbox. Compacted: every event is a
# full snapshot keyed by document id, so a consumer can rebuild from the start of the topic.
# Restaurants as published in the backoffice; catalog consumes them.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: backoffice.restaurant.v1
  namespace: nothingeats
  labels:
    strimzi.io/cluster: kafka
spec:
  partitions: 3
  replicas: 1
  config:
    cleanup.policy: compact
---
