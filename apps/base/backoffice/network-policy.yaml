# Who may call backoffice: the admin through the gateway. Everything else is denied
# (infrastructure/configs/network-policies.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backoffice
  namespace: nothingeats
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backoffice
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: http
