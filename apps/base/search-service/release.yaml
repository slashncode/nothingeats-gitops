# Search is a read model: no database and no migrate hook. Its Elasticsearch indices are rebuilt
# from the catalog topics (cron reindex), so losing them costs a reindex, not data. It also serves
# the Craving Coach's retrieval over gRPC, with dish and query embeddings from OpenAI (cached in Valkey).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: search-service
  namespace: nothingeats
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: backend-service-chart
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    image:
      repository: ghcr.io/slashncode/nothingeats-search-service
      tag: main-525038c-1793004957 # {"$imagepolicy": "nothingeats:search-service:tag"}
    migrations:
      enabled: false
    env:
      ELASTICSEARCH__URL: http://search-es-http:9200
      KAFKA__BOOTSTRAP_SERVERS: kafka-kafka-bootstrap:9092
      JWT__JWKS_URL: http://identity-service/api/identity/.well-known/jwks.json
      VALKEY__HOST: valkey
      VALKEY__PORT: "6379"
      EMBEDDINGS__PROVIDER: OPENAI
    secretEnv:
      ELASTICSEARCH__USERNAME:
        secret: search-service-user
        key: username
      ELASTICSEARCH__PASSWORD:
        secret: search-service-user
        key: password
      POSTHOG__PROJECT_TOKEN:
        secret: posthog
        key: project-token
      VALKEY__PASSWORD:
        secret: valkey-users
        key: default
      EMBEDDINGS__OPENAI__API_KEY:
        secret: openai
        key: api-key
    # Retrieval for the assistant (SearchService).
    grpc:
      enabled: true
    cronJobs:
      # Manual only, after a mapping or embedding change: kubectl -n nothingeats create job --from=cronjob/search-service-reindex reindex-$(date +%s)
      - name: reindex
        task: reindex
        schedule: "0 4 1 1 *"
        suspend: true
    route:
      enabled: true
