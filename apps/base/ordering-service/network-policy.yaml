# Who may call ordering-service: the shop through the gateway, the backoffice (orders). Everything else is denied
# (infrastructure/configs/network-policies.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ordering-service
  namespace: nothingeats
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ordering-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backoffice
      ports:
        - port: http
