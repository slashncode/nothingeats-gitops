# New images from CI (tag main-<sha>-<unix time>) are picked by timestamp and written into release.yaml.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: social-service
  namespace: nothingeats
spec:
  image: ghcr.io/slashncode/nothingeats-social-service
  interval: 1m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: social-service
  namespace: nothingeats
spec:
  imageRepositoryRef:
    name: social-service
  filterTags:
    pattern: ^main-[a-f0-9]+-(?P<ts>[0-9]+)$
    extract: $ts
  policy:
    numerical:
      order: asc
