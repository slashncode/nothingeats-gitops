# Social publishes nothing; this is its consumer group's dead-letter topic, kept for a month.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: social-service.dlq
  namespace: nothingeats
  labels:
    strimzi.io/cluster: kafka
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: "2592000000"
