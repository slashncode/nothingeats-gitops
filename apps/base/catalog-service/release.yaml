apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: catalog-service
  namespace: nothingeats
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: backend-service-chart
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    image:
      repository: ghcr.io/slashncode/nothingeats-catalog-service
      tag: main-7b38712-1792877104 # {"$imagepolicy": "nothingeats:catalog-service:tag"}
    env:
      DATABASE__URL: jdbc:postgresql://postgres-rw:5432/catalog
      KAFKA__BOOTSTRAP_SERVERS: kafka-kafka-bootstrap:9092
      JWT__JWKS_URL: http://identity-service/api/identity/.well-known/jwks.json
    secretEnv:
      DATABASE__USER:
        secret: catalog-db
        key: username
      DATABASE__PASSWORD:
        secret: catalog-db
        key: password
      POSTHOG__PROJECT_TOKEN:
        secret: posthog
        key: project-token
    cronJobs:
      # Manual only: kubectl -n nothingeats create job --from=cronjob/catalog-service-load-seed seed-$(date +%s)
      - name: load-seed
        task: load-seed
        schedule: "0 5 1 1 *"
        suspend: true
      - name: purge-messaging
        task: purge-messaging
        schedule: "30 3 * * *"
    route:
      enabled: true
