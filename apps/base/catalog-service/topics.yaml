# Owned by the producer. Compacted: events are full snapshots keyed by id, so a new projection
# (search, ordering prices) can rebuild the whole catalog by reading the topic from the start.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: catalog.restaurant.v1
  namespace: nothingeats
  labels:
    strimzi.io/cluster: kafka
spec:
  partitions: 3
  replicas: 1
  config:
    cleanup.policy: compact
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: catalog.dish.v1
  namespace: nothingeats
  labels:
    strimzi.io/cluster: kafka
spec:
  partitions: 3
  replicas: 1
  config:
    cleanup.policy: compact
---
# Flash deals (immutable once published; they simply end). Compacted like the rest of the catalog.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: catalog.deal.v1
  namespace: nothingeats
  labels:
    strimzi.io/cluster: kafka
spec:
  partitions: 3
  replicas: 1
  config:
    cleanup.policy: compact
---
# Backoffice events catalog could not apply (a rule the backoffice cannot check, e.g. a slug taken).
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: catalog-service.dlq
  namespace: nothingeats
  labels:
    strimzi.io/cluster: kafka
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: "2592000000"
