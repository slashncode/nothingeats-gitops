# Owned by the producer. Status changes: seven days.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: delivery.delivery.v1
  namespace: nothingeats
  labels:
    strimzi.io/cluster: kafka
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: "604800000"
---
# Courier positions near a customer's home: one hour, then gone.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: delivery.courier.v1
  namespace: nothingeats
  labels:
    strimzi.io/cluster: kafka
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: "3600000"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: delivery-service.dlq
  namespace: nothingeats
  labels:
    strimzi.io/cluster: kafka
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: "2592000000"
