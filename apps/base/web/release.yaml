# The customer SPA at http://nothingeats.localhost/ (the services keep /api/*).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: web
  namespace: nothingeats
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: static-web-chart
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    image:
      repository: ghcr.io/slashncode/nothingeats-web
      tag: main-8f79f0d-1793371387 # {"$imagepolicy": "nothingeats:web:tag"}
    env:
      POSTHOG_HOST: https://eu.i.posthog.com
    # The project key is public (it ends up in every browser), but lives in one place: apps/base/shared.
    secretEnv:
      POSTHOG_KEY:
        secret: posthog
        key: project-token
    route:
      enabled: true
