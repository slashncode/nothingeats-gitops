# Who may call identity-service: the shop through the gateway, and every pod of the shop: all of them read the JWKS, the backoffice manages accounts. Everything else is denied
# (infrastructure/configs/network-policies.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: identity-service
  namespace: nothingeats
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: identity-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - podSelector: {}
      ports:
        - port: http
