apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: identity-service
  namespace: nothingeats
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: backend-service-chart
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    image:
      repository: ghcr.io/slashncode/nothingeats-identity-service
      tag: main-eb0ee6a-1793377274 # {"$imagepolicy": "nothingeats:identity-service:tag"}
    env:
      DATABASE__URL: jdbc:postgresql://postgres-rw:5432/identity
      KAFKA__BOOTSTRAP_SERVERS: kafka-kafka-bootstrap:9092
      VALKEY__HOST: valkey
      VALKEY__PORT: "6379"
      # Become admin on verification or login (local cluster: register this address via Mailpit).
      ADMIN__EMAILS: admin@nothingeats.dev
    secretEnv:
      DATABASE__USER:
        secret: identity-db
        key: username
      DATABASE__PASSWORD:
        secret: identity-db
        key: password
      KEYS__ENCRYPTION_KEY:
        secret: identity-keys
        key: encryption-key
      POSTHOG__PROJECT_TOKEN:
        secret: posthog
        key: project-token
      POSTHOG__PERSONAL_API_KEY:
        secret: identity-posthog
        key: personal-api-key
      VALKEY__PASSWORD:
        secret: valkey-users
        key: default
    cronJobs:
      - name: rotate-keys
        task: rotate-signing-keys
        schedule: "0 3 * * *"
      - name: purge-messaging
        task: purge-messaging
        schedule: "30 3 * * *"
      # Erases deleted accounts at PostHog with the personal API key (record 030).
      - name: erase-analytics
        task: erase-analytics
        schedule: "15 * * * *"
    # Argon2 needs 19 MiB of heap per hash (at most four at once); more room than the chart default.
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        memory: 640Mi
    route:
      enabled: true
