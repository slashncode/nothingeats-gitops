apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: notification-service
  namespace: nothingeats
spec:
  image: ghcr.io/slashncode/nothingeats-notification-service
  interval: 1m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: notification-service
  namespace: nothingeats
spec:
  imageRepositoryRef:
    name: notification-service
  filterTags:
    pattern: ^main-[a-f0-9]+-(?P<ts>[0-9]+)$
    extract: $ts
  policy:
    numerical:
      order: asc
