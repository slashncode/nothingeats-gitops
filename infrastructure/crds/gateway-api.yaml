# Gateway API CRDs (standard channel) in the version Traefik is built against.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 24h
  url: https://github.com/kubernetes-sigs/gateway-api
  ref:
    tag: v1.6.3
  ignore: |
    /*
    !/config/crd/standard/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api-crds
  namespace: flux-system
spec:
  interval: 24h
  path: ./config/crd/standard
  prune: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: gateway-api
