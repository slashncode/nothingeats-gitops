# Catches every mail locally. Web UI: http://mail.nothingeats.localhost, SMTP from the host: localhost:11025.
apiVersion: v1
kind: Namespace
metadata:
  name: mailpit
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jouve
  namespace: mailpit
spec:
  interval: 12h
  url: https://jouve.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mailpit
  namespace: mailpit
spec:
  interval: 1h
  chart:
    spec:
      chart: mailpit
      version: 0.37.0
      sourceRef:
        kind: HelmRepository
        name: jouve
  values:
    resourcesPreset: nano
    service:
      smtp:
        type: NodePort
        nodePort: 30025
