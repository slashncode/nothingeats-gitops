# Elastic Cloud on Kubernetes: operator for Elasticsearch. Watches all namespaces, like Strimzi.
apiVersion: v1
kind: Namespace
metadata:
  name: elastic-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: elastic
  namespace: elastic-system
spec:
  interval: 12h
  url: https://helm.elastic.co
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: eck-operator
  namespace: elastic-system
spec:
  interval: 1h
  chart:
    spec:
      chart: eck-operator
      version: 3.5.0
      sourceRef:
        kind: HelmRepository
        name: elastic
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # No phone-home from a laptop cluster.
    telemetry:
      disabled: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
