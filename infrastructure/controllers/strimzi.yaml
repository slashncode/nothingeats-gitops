# Strimzi operator for Kafka. Watches all namespaces so it does not depend on app namespaces existing first.
apiVersion: v1
kind: Namespace
metadata:
  name: strimzi
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: strimzi
  namespace: strimzi
spec:
  interval: 12h
  url: https://strimzi.io/charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: strimzi-kafka-operator
  namespace: strimzi
spec:
  interval: 1h
  chart:
    spec:
      chart: strimzi-kafka-operator
      version: 1.3.0
      sourceRef:
        kind: HelmRepository
        name: strimzi
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    watchAnyNamespace: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 384Mi
