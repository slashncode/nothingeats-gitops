# Single-node Kafka in KRaft mode (controller and broker in one pool).
# In the cluster: kafka-kafka-bootstrap:9092. From the host: localhost:19094 (k3d maps it to the
# broker's NodePort 30094, and the broker advertises exactly that address).
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual
  namespace: nothingeats
  labels:
    strimzi.io/cluster: kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim
    size: 2Gi
    deleteClaim: false
  jvmOptions:
    "-Xms": 384m
    "-Xmx": 384m
  resources:
    requests:
      cpu: 200m
      memory: 768Mi
    limits:
      memory: 1Gi
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka
  namespace: nothingeats
spec:
  kafka:
    version: 4.2.1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: external
        port: 9094
        type: nodeport
        tls: false
        configuration:
          bootstrap:
            nodePort: 30096
          brokers:
            - broker: 0
              nodePort: 30094
              advertisedHost: localhost
              advertisedPort: 19094
    config:
      auto.create.topics.enable: false
      default.replication.factor: 1
      min.insync.replicas: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
  entityOperator:
    topicOperator:
      resources:
        requests:
          cpu: 50m
          memory: 192Mi
        limits:
          memory: 256Mi
