# Single-node Kafka in KRaft mode (controller and broker in one pool).
# In the cluster: kafka-kafka-bootstrap:9092, no login (its network policy admits the shop's pods
# only). From the host: localhost:19094 (k3d maps it to the broker's NodePort 30094, and the broker
# advertises exactly that address) with a SCRAM-SHA-512 login as KafkaUser `developer`; the User
# Operator keeps its password in Secret `developer` (`just kafka-env` in the hub prints it).
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual
  namespace: nothingeats
  labels:
    strimzi.io/cluster: kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim
    size: 2Gi
    deleteClaim: false
  jvmOptions:
    "-Xms": 384m
    "-Xmx": 384m
  resources:
    requests:
      cpu: 200m
      memory: 768Mi
    limits:
      memory: 1Gi
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka
  namespace: nothingeats
spec:
  kafka:
    version: 4.2.1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
        # Strimzi's NetworkPolicy lets only the shop's own pods (namespace nothingeats) in here.
        networkPolicyPeers:
          - podSelector: {}
      - name: external
        port: 9094
        type: nodeport
        tls: false
        # Anything on the host could otherwise read every topic (identity's events carry addresses).
        authentication:
          type: scram-sha-512
        configuration:
          bootstrap:
            nodePort: 30096
          brokers:
            - broker: 0
              nodePort: 30094
              advertisedHost: localhost
              advertisedPort: 19094
    config:
      auto.create.topics.enable: false
      default.replication.factor: 1
      min.insync.replicas: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
  entityOperator:
    topicOperator:
      resources:
        requests:
          cpu: 50m
          memory: 192Mi
        limits:
          memory: 256Mi
    userOperator:
      resources:
        requests:
          cpu: 50m
          memory: 192Mi
        limits:
          memory: 256Mi
---
# The login for the host's listener: services run from the IDE, kcat, scripts. No authorization is
# configured on the cluster, so a signed-in user may do anything, like the pods on the inner listener.
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: developer
  namespace: nothingeats
  labels:
    strimzi.io/cluster: kafka
spec:
  authentication:
    type: scram-sha-512
